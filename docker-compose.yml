services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: thermalens
      POSTGRES_USER: thermalens
      POSTGRES_PASSWORD: thermalens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermalens -d thermalens"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Live PostGIS read path (app falls back to JSON automatically if absent)
      DATABASE_URL: postgresql://thermalens:thermalens@db:5432/thermalens
      # OpenWeatherMap 5-day / 3-hour Forecast API key (required for live weather; app falls
      # back to a clearly-labelled demo series if unset)
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      # Weather refresh interval in seconds (default 1800 = 30 min). The app clamps it so
      # OpenWeatherMap usage stays inside the free tier; see GET /api/weather/budget.
      HW_LIVE_REFRESH_S: ${HW_LIVE_REFRESH_S:-1800}
      # Real Twilio sends: provide your credentials to enable (otherwise SIMULATED, honestly)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_TO: ${TWILIO_TO:-}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python backend/load_postgis.py; python backend/main.py"

volumes:
  pgdata:
